# 统一入口（Consul 动态 upstream）：deploy/gateway/up-discovery.ps1
# upstream 定义见 consul-template 生成的 00-upstreams.conf

server {
    listen 8080;
    server_name _;
    client_max_body_size 128m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    location = /b2c_persist.js {
        proxy_pass http://b2c_companion;
    }

    location /b2c/ {
        rewrite ^/b2c/(.*)$ /$1 break;
        proxy_pass http://b2c_companion;
    }

    location /api/eval {
        proxy_pass http://b2c_companion;
    }
    location /api/tools {
        proxy_pass http://b2c_companion;
    }
    location /api/users/suggestions {
        proxy_pass http://b2c_memory;
    }
    location /api/users {
        proxy_pass http://b2c_companion;
    }
    location /api/me {
        proxy_pass http://b2c_memory;
    }
    location /api/login {
        proxy_pass http://b2c_memory;
    }
    location /api/logout {
        proxy_pass http://b2c_memory;
    }
    location /api/timeline {
        proxy_pass http://b2c_memory;
    }
    location /api/search {
        proxy_pass http://b2c_memory;
    }
    location /api/rag {
        proxy_pass http://b2c_memory;
    }
    location /api/card {
        proxy_pass http://b2c_memory;
    }

    location /report/ {
        rewrite ^/report/(.*)$ /$1 break;
        proxy_pass http://b2c_report;
    }
    location /doc/ {
        rewrite ^/doc/(.*)$ /$1 break;
        proxy_pass http://b2c_doc;
    }
    location /crawl/ {
        rewrite ^/crawl/(.*)$ /$1 break;
        proxy_pass http://b2c_crawl;
    }

    location / {
        proxy_pass http://b2c_vite;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
