# 统一进门：对齐 web-frontend/vite.config.js shell 模式代理规则。
# 启动：deploy/gateway/up.ps1  →  http://127.0.0.1:8080
# 依赖本机已起 5173(vite)、8002、8012–8015；容器内用 host.docker.internal 访问宿主机。

upstream b2c_vite {
    server host.docker.internal:5173 max_fails=3 fail_timeout=30s;
}
upstream b2c_companion {
    server host.docker.internal:8002 max_fails=3 fail_timeout=30s;
}
upstream b2c_memory {
    server host.docker.internal:8015 max_fails=3 fail_timeout=30s;
}
upstream b2c_report {
    server host.docker.internal:8012 max_fails=3 fail_timeout=30s;
}
upstream b2c_doc {
    server host.docker.internal:8013 max_fails=3 fail_timeout=30s;
}
upstream b2c_crawl {
    server host.docker.internal:8014 max_fails=3 fail_timeout=30s;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 128m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    location = /b2c_persist.js {
        proxy_pass http://b2c_companion;
    }

    location /b2c/ {
        rewrite ^/b2c/(.*)$ /$1 break;
        proxy_pass http://b2c_companion;
    }

    location /api/eval {
        proxy_pass http://b2c_companion;
    }
    location /api/tools {
        proxy_pass http://b2c_companion;
    }
    location /api/users/suggestions {
        proxy_pass http://b2c_memory;
    }
    location /api/users {
        proxy_pass http://b2c_companion;
    }
    location /api/me {
        proxy_pass http://b2c_memory;
    }
    location /api/login {
        proxy_pass http://b2c_memory;
    }
    location /api/logout {
        proxy_pass http://b2c_memory;
    }
    location /api/timeline {
        proxy_pass http://b2c_memory;
    }
    location /api/search {
        proxy_pass http://b2c_memory;
    }
    location /api/rag {
        proxy_pass http://b2c_memory;
    }
    location /api/card {
        proxy_pass http://b2c_memory;
    }

    # 工具子站（与 vite 各 mode 一致，可按需直连原端口）
    location /report/ {
        rewrite ^/report/(.*)$ /$1 break;
        proxy_pass http://b2c_report;
    }
    location /doc/ {
        rewrite ^/doc/(.*)$ /$1 break;
        proxy_pass http://b2c_doc;
    }
    location /crawl/ {
        rewrite ^/crawl/(.*)$ /$1 break;
        proxy_pass http://b2c_crawl;
    }

    location / {
        proxy_pass http://b2c_vite;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
