[project]
name = "b2c-companion"
version = "0.1.0"
description = "B2C 陪聊 API（LangGraph + Agent + Redis/Neo4j）"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain>=1.3.14",
    "langchain-community>=0.3.21",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "dashscope>=1.22.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "pymysql>=1.2.0",
    "langchain-huggingface>=1.2.2",
    "pymilvus>=3.0.0",
    "torch>=2.10.0,<3",
    "sentence-transformers>=5.6.1",
    "langchain-mcp-adapters>=0.3.0",
    "fastapi>=0.139.2",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
    "pyyaml>=6.0.3",
    "unstructured>=0.24.1",
    "markdown>=3.10.2",
    "pi-heif>=1.4.0",
    "unstructured-inference>=1.6.13",
    "pdf2image>=1.17.0",
    "unstructured-pytesseract>=0.3.15",
    "python-docx>=1.2.0",
    "jieba>=0.42.1",
    "faiss-cpu>=1.14.3",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "sqlacodegen>=4.0.4",
    "mineru[all]>=3.0.4",
    "xgboost>=3.2.0",
    "pdfplumber>=0.11.10",
    "streamlit>=1.61.1",
    "psycopg[binary]>=3.3.4",
    "neo4j>=6.2.0",
    "neo4j-graphrag>=1.18.0",
    "openpyxl>=3.1.5",
    "rouge-score>=0.1.2",
    "pytesseract>=0.3.13",
    "pyautogen>=0.10.0",
    "chainlit>=2.12.0",
    "autogen-ext[openai]>=0.7.5",
    "alibabacloud-bailian20231229>=2.14.4",
    "alibabacloud-tea-openapi>=0.4.6",
    "oss2>=2.19.1",
    "langgraph-supervisor>=0.0.31",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
