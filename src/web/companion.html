<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B2C 陪聊调试台</title>
  <style>
    :root {
      --bg: #eef3ef;
      --ink: #1c241e;
      --muted: #5c6b62;
      --card: #ffffff;
      --line: #d5e0d8;
      --accent: #2f6f4e;
      --accent-soft: #e4f2ea;
      --user: #d8eee2;
      --ai: #f3f1eb;
      --code: #152019;
      --code-fg: #d7e8dc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: radial-gradient(1200px 500px at 10% -10%, #dceadf, var(--bg));
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .shell { max-width: 1180px; margin: 0 auto; padding: 24px 20px 40px; }
    .hero { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 26px; letter-spacing: .02em; }
    .sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--muted); }
    .chip strong { color: var(--ink); font-weight: 600; }
    .grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: 0 10px 30px rgba(28, 36, 30, .05); }
    .toolbar { display: flex; gap: 8px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fbfdfb;
      font-size: 14px;
    }
    input:focus { outline: 2px solid #b7d7c4; border-color: var(--accent); }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      background: #e8eee9;
      color: var(--ink);
      font-weight: 600;
      white-space: nowrap;
    }
    button.primary { background: var(--accent); color: #fff; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .messages {
      min-height: 360px;
      max-height: 52vh;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px 2px 4px;
    }
    .msg { max-width: 82%; padding: 10px 12px; border-radius: 14px; white-space: pre-wrap; line-height: 1.5; font-size: 14px; }
    .msg.user { align-self: flex-end; background: var(--user); }
    .msg.ai { align-self: flex-start; background: var(--ai); }
    .msg-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .msg-actions button { padding: 6px 10px; font-size: 12px; background: var(--accent-soft); color: var(--accent); }
    .msg.sys { align-self: center; background: var(--accent-soft); color: var(--muted); font-size: 12px; }
    .composer { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
    .speak-toggle { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); white-space: nowrap; }
    button.mic-on { background: #b42318; color: #fff; }
    .debug-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .debug-head h2 { margin: 0; font-size: 16px; }
    .debug-grid { display: grid; gap: 14px; }
    .block h3 { margin: 0 0 8px; font-size: 13px; color: var(--ink); font-weight: 650; }
    .dbg {
      background: #f4f8f5;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 4px 12px;
      font-size: 13px;
      line-height: 1.5;
      max-height: 240px;
      overflow: auto;
    }
    .dbg .row { display: grid; grid-template-columns: 4.5em 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid #e4eee8; }
    .dbg .row:last-child { border-bottom: 0; }
    .dbg .k { color: var(--muted); }
    .dbg .v { white-space: pre-wrap; word-break: break-word; }
    .dbg .empty { color: var(--muted); padding: 10px 0; }
    .dbg .step-hd {
      margin: 16px 0 6px;
      padding: 8px 12px;
      border-radius: 8px;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.03em;
    }
    .dbg .step-hd:first-child { margin-top: 4px; }
    .dbg .sec {
      margin: 10px 0 0 4px;
      padding-left: 8px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.04em;
      border-left: 2px solid #c5d9cc;
    }
    .dbg .sec.sec-em {
      margin-top: 12px;
      color: #3d5c48;
      font-weight: 650;
      border-left-color: var(--accent);
    }
    .dbg.dbg-tall { max-height: 520px; }
    .dbg .para {
      margin: 4px 0 6px 12px;
      padding: 8px 10px;
      background: #fff;
      border-radius: 8px;
      border: 1px solid #e8f0eb;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      line-height: 1.5;
    }
    .hint { color: var(--muted); font-size: 12px; }
    @media (max-width: 900px) {
      .grid, .hero { grid-template-columns: 1fr; display: block; }
      .hero { margin-bottom: 14px; }
      .meta { margin-top: 10px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <div>
        <h1>B2C 长期陪聊</h1>
        <p class="sub">进行中消息只在服务端 SessionStore；刷新/关页不释放。结束、新建、切换账号或空闲 TTL 会关场并写入 localStorage 草稿。</p>
        <p class="sub b2c-user-bar"></p>
        <p class="sub"><a href="/" id="linkSwitchUser" style="color:#2f6f4e;">切换账号</a> · <a href="/tools" style="color:#2f6f4e;">工具注册表</a> · <a href="/eval" style="color:#2f6f4e;">评测台</a></p>
      </div>
      <div class="meta">
        <span class="chip">session <strong id="chipSession">未创建</strong></span>
        <span class="chip">group/user <strong id="chipUser">-</strong></span>
      </div>
    </div>

    <div class="grid">
      <section class="card">
        <div class="toolbar">
          <input id="userId" required autocomplete="off" placeholder="必填：Neo4j UserInfo.id" />
          <button id="btnNew" class="primary">新建会话</button>
          <button id="btnEnd">结束并入库</button>
        </div>
        <div id="messages" class="messages">
          <div class="msg sys">填写 user_id 后新建会话，再开始说话。</div>
        </div>
        <div class="composer">
          <input id="text" placeholder="说说近况、症状、心情…" />
          <input id="reportFile" type="file" accept=".png,.jpg,.jpeg,.jfif,.webp,.gif,.bmp,.tif,.tiff,.heic,.heif,.ico,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.ppt,.pptx" style="display:none" />
          <button id="btnReport" type="button">上传报告</button>
          <button id="btnMic" type="button">按住说话</button>
          <label class="speak-toggle"><input id="chkThink" type="checkbox" /> 思考模式</label>
          <label class="speak-toggle"><input id="chkSpeak" type="checkbox" checked /> 播报</label>
          <button id="btnSend" class="primary">发送</button>
        </div>
      </section>

      <aside class="card">
        <div class="debug-head">
          <h2>本轮调试</h2>
          <span class="hint" id="debugHint">还没有回合</span>
        </div>
        <div class="debug-grid">
          <div class="block">
            <h3>进入主图环节</h3>
            <div class="dbg" id="dumpPrep"><div class="empty">还没有</div></div>
          </div>
          <div class="block">
            <h3>怎么回答的</h3>
            <div class="dbg" id="dumpRound"><div class="empty">还没有</div></div>
          </div>
          <div class="block">
            <h3>各环节 LLM 调用上下文组成</h3>
            <div class="dbg dbg-tall" id="dumpFacts"><div class="empty">还没有</div></div>
          </div>
          <div class="block">
            <h3>RAG增强</h3>
            <div class="dbg dbg-tall" id="dumpRag"><div class="empty">还没有</div></div>
          </div>
          <div class="block">
            <h3>中间件的使用</h3>
            <div class="dbg dbg-tall" id="dumpMiddleware"><div class="empty">还没有</div></div>
          </div>
          <div class="block">
            <h3>trace</h3>
            <div class="dbg dbg-tall" id="dumpTrace"><div class="empty">还没有</div></div>
          </div>
          <div class="block">
            <h3>这场记住的词</h3>
            <div class="dbg" id="dumpSession"><div class="empty">还没有</div></div>
          </div>
        </div>
      </aside>
    </div>
  </div>
  <script src="/b2c_persist.js"></script>
  <script>
    let sessionId = "";
    let resumeToken = "";
    let closing = false;
    let liveLlmRows = [];
    let liveToolRows = [];
    let liveMwRows = [];
    const $ = (id) => document.getElementById(id);

    function resetLiveDebug() {
      liveLlmRows = [];
      liveToolRows = [];
      liveMwRows = [];
      fillDbg($("dumpFacts"), []);
      fillDbg($("dumpTrace"), []);
      fillDbg($("dumpMiddleware"), []);
    }

    function appendLiveDebug(data) {
      if (!data || !data.kind) return;
      if (data.kind === "llm") {
        liveLlmRows.push(["标题", data.step || "LLM"]);
        (data.sections || []).forEach((sec) => {
          if (!sec) return;
          liveLlmRows.push(["节", sec.title || ""]);
          liveLlmRows.push(["段", sec.body || ""]);
        });
        if (data.got) {
          liveLlmRows.push(["节", "得到"]);
          liveLlmRows.push(["段", data.got]);
        }
        fillDbg($("dumpFacts"), liveLlmRows);
        return;
      }
      if (data.kind === "middleware") {
        liveMwRows.push(["中间件", data.name || data.title || "中间件"]);
        if (data.route) liveMwRows.push(["路线", data.route]);
        liveMwRows.push(["段", data.body || ""]);
        fillDbg($("dumpMiddleware"), liveMwRows);
        return;
      }
      if (data.kind === "trace") {
        const title = data.title || "子图 trace";
        if (!data.append) {
          liveToolRows.push(["标题", title]);
          liveToolRows.push(["节", data.section || ""]);
          liveToolRows.push(["段", data.body || ""]);
        } else {
          const prev = liveToolRows[liveToolRows.length - 1];
          const sec = liveToolRows[liveToolRows.length - 2];
          if (prev && prev[0] === "段" && sec && sec[0] === "节" && sec[1] === (data.section || "tool_call_chunks")) {
            prev[1] += data.body || "";
          } else {
            liveToolRows.push(["标题", title]);
            liveToolRows.push(["节", data.section || "tool_call_chunks"]);
            liveToolRows.push(["段", data.body || ""]);
          }
        }
        fillDbg($("dumpTrace"), liveToolRows);
        return;
      }
      if (data.kind === "tool_call" || data.kind === "tool") {
        appendLiveDebug({
          kind: "trace",
          title: "子图 · function call 流式 · " + (data.name || "?"),
          section: "tool_call_chunks",
          body: data.args_delta || data.body || data.summary || "",
          append: data.kind === "tool_call",
        });
      }
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    }
    function joinBits(v) {
      if (v == null || v === "") return "";
      if (Array.isArray(v)) return v.map((x) => (typeof x === "string" ? x : (x && (x.name || x.text || x.content || x.standard_name)) || "")).filter(Boolean).join("、");
      if (typeof v === "object") return "";
      return String(v);
    }
    function fillDbg(el, rows) {
      const parts = [];
      for (const r of rows || []) {
        if (!r) continue;
        if (r[0] === "标题") {
          parts.push('<div class="step-hd">' + esc(r[1]) + "</div>");
          continue;
        }
        if (r[0] === "节") {
          const em = r[1] === "工具执行" || r[1] === "得到";
          parts.push('<div class="sec' + (em ? " sec-em" : "") + '">' + esc(r[1]) + "</div>");
          continue;
        }
        if (r[0] === "段") {
          parts.push('<div class="para">' + esc(r[1]) + "</div>");
          continue;
        }
        if (!String(r[1] || "").trim()) continue;
        parts.push(
          '<div class="row"><div class="k">' +
            esc(r[0]) +
            '</div><div class="v">' +
            esc(r[1]) +
            "</div></div>"
        );
      }
      if (!parts.length) {
        el.innerHTML = '<div class="empty">这一块没有内容</div>';
        return;
      }
      el.innerHTML = parts.join("");
    }
    function mentionLines(mentions) {
      const bag = mentions && typeof mentions === "object" ? mentions : {};
      return Object.keys(bag).map((k) => {
        const vals = joinBits(bag[k]);
        return vals ? k + "：" + vals : "";
      }).filter(Boolean).join("\n");
    }
    function alignLines(rows) {
      return (rows || []).map((hit) => {
        if (!hit || typeof hit !== "object") return "";
        const said = hit.mention || hit.text || "";
        const std = hit.standard_name || hit.name || "";
        if (!said && !std) return "";
        return said && std && said !== std ? said + " → " + std : (std || said);
      }).filter(Boolean).join("\n");
    }
    function factLines(facts) {
      return (facts || []).map((item) => {
        if (typeof item === "string") return item;
        if (!item || typeof item !== "object") return "";
        return item.content || item.text || item.fact || item.name || "";
      }).filter(Boolean).join("\n");
    }
    function howItRan(graph) {
      const g = graph && typeof graph === "object" ? graph : {};
      const n = g.workers;
      const handoff = g.peer_handoff;
      if (!n && !g.pattern) return "";
      let line = n ? "分成 " + n + " 路一起答" : "按意图回答";
      if (handoff) line += "，中间互相补了一句";
      const reviews = (g.reviews || []).map((r, i) => {
        const name = r.intent || r.major || ("第" + (i + 1) + "路");
        return name + (r.pass ? "：过了" : "：没过");
      }).filter(Boolean);
      if (reviews.length) line += "\n" + reviews.join("\n");
      return line;
    }
    function hitlLine(hitl) {
      const row = hitl && typeof hitl === "object" ? hitl : null;
      if (!row || !(row.pending || row.hitl_kind || row.question)) return "没有停下来等你";
      const ask = row.question || "";
      if (row.hitl_kind === "tool_approval") return ask ? "等你确认工具：" + ask : "等你确认要不要调用工具";
      if (row.hitl_kind === "slot_fill") return ask ? "等你补一句：" + ask : "等你补充信息";
      return ask || "停下来等你操作";
    }
    let lastPrep = null;
    function handlerLine(detail) {
      const intents = (detail && detail.intents) || [];
      const rows = intents.map((item) => {
        if (!item || typeof item !== "object") return "";
        const name = item.intent || item.major || "这一路";
        return name + "：" + (item.handler || "兜底");
      }).filter(Boolean);
      if (rows.length) return rows.join("\n");
      return detail && detail.handler ? detail.handler : "";
    }
    function splitLine(detail, graph) {
      const g = graph && typeof graph === "object" ? graph : {};
      const planned = ((detail && detail.intents) || []).length;
      const n = g.workers || planned;
      if (!n) return "还没拆路";
      let line = "拆成 " + n + " 路";
      if (g.peer_handoff) line += "，中间互相补了一句";
      const reviews = (g.reviews || []).map((r, i) => {
        const name = r.intent || r.major || ("第" + (i + 1) + "路");
        return name + (r.pass ? "：过了" : "：没过");
      }).filter(Boolean);
      if (reviews.length) line += "\n" + reviews.join("\n");
      return line;
    }
    function kgLine(p) {
      const errors = p.stage_errors && typeof p.stage_errors === "object" ? p.stage_errors : {};
      const errText = Object.keys(errors).map((k) => errors[k]).filter(Boolean).join("；");
      if (errText) return "没查成：" + errText;
      if (p.entity_extracted === false) return "这轮没查知识库";
      const n = (p.alignments || []).length;
      if (!n) return "查了，没对上标准名";
      return "查了，对上 " + n + " 条";
    }
    let lastGraph = null;
    function taskLines(tasks, detail) {
      const rows = (tasks && tasks.length) ? tasks : ((detail && detail.intents) || []);
      return rows.map((item, i) => {
        if (!item || typeof item !== "object") return "";
        const bits = [item.major, item.intent, item.handler].filter(Boolean);
        return (i + 1) + ". " + (bits.join(" / ") || "空任务");
      }).filter(Boolean).join("\n");
    }
    function paintPrep(pre, hitl, graph, tasks) {
      if (pre) lastPrep = pre;
      if (graph) lastGraph = graph;
      const p = pre && typeof pre === "object" ? pre : {};
      const said = p.raw_text || "";
      const corrected = p.corrected_text || said;
      const resolved = p.resolved_text || corrected;
      const spell = p.spell && typeof p.spell === "object" ? p.spell : {};
      const coref = p.coref && typeof p.coref === "object" ? p.coref : {};
      const detail = p.intent_detail && typeof p.intent_detail === "object" ? p.intent_detail : {};
      const intents = (detail.intents || []).map((item) => {
        if (!item || typeof item !== "object") return "";
        return [item.intent, item.major].filter(Boolean).join(" · ");
      }).filter(Boolean);
      const intentLine = intents.length
        ? intents.join("\n")
        : [p.intent, p.intent_major].filter(Boolean).join(" · ");
      const spellLine = spell.changed || (corrected && corrected !== said)
        ? corrected
        : "没改";
      const corefLine = coref.changed || (resolved && resolved !== corrected)
        ? resolved
        : "没补";
      fillDbg($("dumpPrep"), [
        ["原话", said || "还没有"],
        ["纠错", spellLine],
        ["补全", corefLine],
        ["标题", "意图环节"],
        ["意图", intentLine || "还没判"],
        ["tasks", taskLines(tasks, detail) || "还没有任务"],
        ["否定", joinBits(p.negated) || "没有"],
        ["抽出", mentionLines(p.mentions) || "没有"],
        ["对齐", alignLines(p.alignments) || "没有"],
        ["处理", handlerLine(detail) || "兜底"],
        ["拆路", splitLine(detail, graph || lastGraph)],
        ["知识库", kgLine(p)],
        ["HITL", hitlLine(hitl)],
      ]);
    }
    function checkpointDbgRows(ckpt) {
      const block = ckpt && typeof ckpt === "object" ? ckpt : null;
      if (!block) return [];
      const rows = [["标题", "checkpoint"]];
      const comp = block.companion_checkpointer || {};
      const hitl = block.hitl_checkpointer || {};
      rows.push(["节", "get_companion_checkpointer()"]);
      rows.push(["实例", JSON.stringify(comp.checkpointer || {}, null, 2)]);
      rows.push(["主图 thread", String(comp.thread_id || "")]);
      rows.push(["retention", String(comp.retention || "")]);
      rows.push(["graph_state", JSON.stringify(comp.graph_state || {}, null, 2)]);
      const versions = comp.checkpoint_versions || [];
      rows.push(["节", "主图 checkpoint 版本序列"]);
      if (!versions.length) {
        rows.push(["段", String(comp.versions_note || comp.read_after_release ? "释放后读取，版本已清空" : "（无版本）")]);
      }
      versions.forEach((v) => {
        if (!v || typeof v !== "object") return;
        const head = "#" + (v.seq || "?") + " · " + (v.node_hint || "节点") +
          " · step=" + (v.step != null ? v.step : "?") +
          " · source=" + (v.source || "?");
        rows.push(["序号", head]);
        rows.push(["段", JSON.stringify(v, null, 2)]);
      });
      rows.push(["节", "get_hitl_checkpointer()"]);
      rows.push(["实例", JSON.stringify(hitl.checkpointer || {}, null, 2)]);
      rows.push(["HITL 状态", String(hitl.hitl_status || "没有 HITL 触发")]);
      if (hitl.pending) {
        rows.push(["待办", JSON.stringify(hitl.pending, null, 2)]);
      }
      rows.push(["slot 图", JSON.stringify(hitl.slot_graph_state || {}, null, 2)]);
      rows.push(["meta 图", JSON.stringify(hitl.meta_graph_state || {}, null, 2)]);
      const slotVers = hitl.slot_checkpoint_versions || [];
      const metaVers = hitl.meta_checkpoint_versions || [];
      if (slotVers.length) {
        rows.push(["节", "HITL slot checkpoint 版本序列"]);
        slotVers.forEach((v) => {
          rows.push(["序号", "#" + (v.seq || "?") + " · " + (v.node_hint || "")]);
          rows.push(["段", JSON.stringify(v, null, 2)]);
        });
      }
      if (metaVers.length) {
        rows.push(["节", "HITL meta checkpoint 版本序列"]);
        metaVers.forEach((v) => {
          rows.push(["序号", "#" + (v.seq || "?") + " · " + (v.node_hint || "")]);
          rows.push(["段", JSON.stringify(v, null, 2)]);
        });
      }
      if (block.note) rows.push(["说明", String(block.note)]);
      return rows;
    }
    function paintRound(data, round) {
      const r = round && typeof round === "object" ? round : {};
      const localTools = joinBits(r.bound_local_tools || data.bound_local_tools);
      const mcpTools = joinBits(r.bound_mcp_tools || data.bound_mcp_tools);
      const allTools = joinBits(r.bound_tools || data.bound_tools);
      const toolLine = localTools || mcpTools
        ? ["本地", localTools || "无"].join("：") + "\n" + ["MCP", mcpTools || "无"].join("：")
        : allTools;
      fillDbg($("dumpRound"), [
        ["你说", r.user_text || ""],
        ["工具", toolLine],
        ["走法", howItRan(r.langgraph || data.langgraph)],
        ["回复", (data.reply || r.reply || "").slice(0, 280)],
      ].concat(checkpointDbgRows(r.checkpoint_debug || data.checkpoint_debug || round.checkpoint_debug)));
    }
    function paintRag(blocks) {
      const rows = [];
      (blocks || []).forEach((item) => {
        if (!item) return;
        rows.push(["标题", item.tool || "RAG"]);
        rows.push(["段", item.body || ""]);
      });
      if (!rows.length) {
        fillDbg($("dumpRag"), [["段", "本轮没有 RAGFlow / Chroma / 图谱增强检索。"]]);
        return;
      }
      fillDbg($("dumpRag"), rows);
    }
    function paintLlm(calls) {
      const rows = [];
      (calls || []).forEach((item) => {
        if (!item || typeof item !== "object") return;
        rows.push(["标题", item.step || "这一步"]);
        if (Array.isArray(item.sections)) {
          item.sections.forEach((sec) => {
            if (!sec) return;
            rows.push(["节", sec.title || ""]);
            rows.push(["段", sec.body || ""]);
          });
        } else if (item.gave) {
          rows.push(["节", "交给模型"]);
          rows.push(["段", item.gave]);
        }
        if (item.got) {
          rows.push(["节", "得到"]);
          rows.push(["段", item.got]);
        }
      });
      fillDbg($("dumpFacts"), rows);
    }
    function paintTrace(obs) {
      const o = obs && typeof obs === "object" ? obs : {};
      const rows = [];
      if (!o.trace_id && !(o.tool_runs && o.tool_runs.length)) {
        fillDbg($("dumpTrace"), []);
        return;
      }
      rows.push(["trace_id", o.trace_id || "—"]);
      if (o.thread_id) rows.push(["graph thread", o.thread_id]);
      if (o.pattern) rows.push(["pattern", String(o.pattern) + (o.workers != null ? " · workers=" + o.workers : "")]);
      if (o.peer_handoff) rows.push(["peer_handoff", "是"]);
      (o.reviews || []).forEach((r, i) => {
        const name = (r && (r.intent || r.major)) || ("路" + (i + 1));
        rows.push(["评审", name + (r && r.pass ? " · 过" : " · 未过")]);
      });
      (o.tool_runs || []).forEach((run) => {
        if (!run) return;
        const route = [run.major, run.intent].filter(Boolean).join(" / ") || run.handler || "worker";
        rows.push(["节", route]);
        if (run.bound_tools && run.bound_tools.length) {
          rows.push(["绑定工具", run.bound_tools.join("、")]);
        }
        (run.middleware_trace || []).forEach((mw) => {
          if (!mw) return;
          rows.push(["中间件", (mw.name || "?") + (mw.route ? " @ " + mw.route : "") + (mw.detail ? "\n" + mw.detail : "")]);
        });
        (run.steps || []).forEach((st, idx) => {
          if (!st) return;
          let tag = st.source === "mcp" ? "MCP" : "local";
          if (st.mcp_server) tag += "/" + st.mcp_server;
          rows.push(["工具 " + (idx + 1), (st.name || "?") + " · " + tag + " · ok=" + (st.ok != null ? st.ok : "?")]);
          if (st.args) rows.push(["入参", st.args]);
          if (st.summary) rows.push(["摘要", st.summary]);
          const env = st.envelope;
          if (env && typeof env === "object") {
            if (env.error) rows.push(["error", env.error]);
            if (env.data && Object.keys(env.data).length) {
              rows.push(["envelope.data", JSON.stringify(env.data, null, 2)]);
            }
          }
        });
        if (!(run.steps || []).length) rows.push(["工具", "（本轮未调用）"]);
      });
      rows.push(["节", "原始 JSON"]);
      rows.push(["段", JSON.stringify(o, null, 2)]);
      fillDbg($("dumpTrace"), rows);
    }
    function paintSlots(session) {
      const slots = (session && session.slot_memory) || {};
      fillDbg($("dumpSession"), [
        ["部位", joinBits(slots["部位"])],
        ["症状", joinBits(slots["症状"])],
        ["疾病", joinBits(slots["疾病"])],
        ["检查", joinBits(slots["检查"])],
        ["指标", joinBits(slots["指标"])],
      ]);
    }
    function formatReportSummary(report) {
      if (!report || !report.filename) return "";
      const inds = report.indicators || [];
      const lines = ["【报告摘要】" + report.filename + " · " + (inds.length || 0) + " 项指标"];
      inds.slice(0, 8).forEach((item) => {
        const name = item.name || "";
        const value = [item.value, item.unit, item.flag].filter(Boolean).join(" ");
        if (name) lines.push("- " + name + " " + value);
      });
      return lines.join("\n");
    }

    function addMsg(role, text, actions) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      const body = document.createElement("div");
      body.className = "msg-text";
      body.textContent = text;
      el.appendChild(body);
      $("messages").appendChild(el);
      attachActions(el, actions);
      $("messages").scrollTop = $("messages").scrollHeight;
      return el;
    }

    function roleFromSessionRow(item) {
      const rt = String(item.role_type || item.role || "");
      if (rt === "user") return "user";
      if (rt === "assistant") return "ai";
      return "sys";
    }

    function renderMessagesFromSession(session) {
      $("messages").innerHTML = "";
      const rows = list(session && session.user) ? session.user : [];
      if (!rows.length) {
        addMsg("sys", "填写 user_id 后新建会话，再开始说话。");
        return;
      }
      for (const item of rows) {
        addMsg(roleFromSessionRow(item), String(item.content || ""));
      }
    }

    function list(v) {
      return Array.isArray(v) ? v : [];
    }

    function saveReleasedDraftFromSession(sessionPayload) {
      const uid = ($("userId").value || "").trim() || (window.B2cPersist && B2cPersist.getUserId()) || "";
      if (!uid || !window.B2cPersist || !sessionPayload) return;
      B2cPersist.saveReleasedChatDraft(uid, sessionPayload);
    }

    async function startSession(opts) {
      const forceNew = !!(opts && opts.forceNew);
      const user_id = ($("userId").value || "").trim();
      if (!user_id) {
        alert("请先填写 user_id（Neo4j UserInfo.id）。");
        $("userId").focus();
        return;
      }
      if (forceNew) {
        await persistSession({ silent: true });
      }
      const res = await fetch("/api/sessions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: user_id, force_new: forceNew }),
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.detail || "会话失败");
        return;
      }
      const canon = String(data.group_id || data.user_id || user_id || "").trim();
      if (canon) {
        $("userId").value = canon;
        if (window.B2cPersist) B2cPersist.setUserId(canon);
      }
      showSessionMeta(data);
      renderMessagesFromSession(data);
      if (data.resumed) {
        addMsg("sys", "已恢复 session_id=" + (data.session_id || sessionId));
      } else if (data.restored_from_draft) {
        addMsg("sys", "已从 user_id 草稿恢复聊天记录（服务端进程重启后）。");
      } else if (!list(data.user).length) {
        addMsg("sys", "会话已建立。下面是进场根据长期记忆的推送。");
        const push = data.push || {};
        addMsg("ai", push.text || "（无推送）");
        paintLlm([]);
        paintRag([]);
      }
      resumeToken = "";
    }

    async function sendToolHitl(decisionType, message) {
      if (!sessionId) return;
      const body = {
        text: message || "",
        resume_token: resumeToken || "",
        hitl_decision: { type: decisionType, message: message || "" },
        think: !!(document.getElementById("chkThink") && document.getElementById("chkThink").checked),
      };
      $("btnSend").disabled = true;
      const res = await fetch("/api/sessions/" + encodeURIComponent(userKey()) + "/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "text/event-stream" },
        body: JSON.stringify(body),
      });
      $("btnSend").disabled = false;
      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        addMsg("sys", "错误: " + (err.detail || "请求失败"));
        return;
      }
      addMsg("user", message || ("（" + decisionType + "）"));
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let assistantEl = null;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split("\n\n");
        buffer = parts.pop() || "";
        for (const block of parts) {
          const line = block.trim();
          if (!line.startsWith("data: ")) continue;
          let data;
          try { data = JSON.parse(line.slice(6)); } catch { continue; }
          if (data.event === "debug") {
            appendLiveDebug(data);
          } else if (data.event === "suspended") {
            resumeToken = data.resume_token || resumeToken;
            attachToolHitl(assistantEl, data);
          } else if (data.event === "token") {
            if (!assistantEl) assistantEl = addMsg("ai", "");
            const bodyEl = assistantEl.querySelector(".msg-text") || assistantEl;
            bodyEl.textContent += data.content || "";
          } else if (data.event === "state") {
            showRound(data.data || {});
          }
        }
      }
    }

    function attachToolHitl(el, data) {
      if (!el || !data || data.hitl_kind !== "tool_approval") return;
      const old = el.querySelector(".msg-hitl-tools");
      if (old) old.remove();
      const bar = document.createElement("div");
      bar.className = "msg-actions msg-hitl-tools";
      const approve = document.createElement("button");
      approve.type = "button";
      approve.textContent = "批准执行";
      approve.onclick = () => sendToolHitl("approve", "确认");
      const reject = document.createElement("button");
      reject.type = "button";
      reject.textContent = "拒绝";
      reject.onclick = () => {
        const msg = prompt("拒绝原因（可选）", "暂不执行");
        if (msg === null) return;
        sendToolHitl("reject", msg);
      };
      bar.appendChild(approve);
      bar.appendChild(reject);
      el.appendChild(bar);
    }

    function attachActions(el, actions) {
      if (!el) return;
      const old = el.querySelector(".msg-actions:not(.msg-hitl-tools)");
      if (old) old.remove();
      if (!actions || !actions.length) return;
      const bar = document.createElement("div");
      bar.className = "msg-actions";
      for (const item of actions) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = item.label || item.id;
        btn.onclick = () => runAction(item.id);
        bar.appendChild(btn);
      }
      el.appendChild(bar);
    }

    function runAction(id) {
      if (id === "upload_report") {
        if (!sessionId) { alert("请先新建会话"); return; }
        $("reportFile").click();
        return;
      }
      if (id === "book_expert") send("帮我预约专家问诊");
    }

    function showSessionMeta(data) {
      sessionId = data.session_id || sessionId;
      $("chipSession").textContent = sessionId || "未创建";
      $("chipUser").textContent = data.group_id || data.user_id || "-";
      paintSlots(data);
    }

    function userKey() {
      return ($("userId").value || "").trim() || sessionId;
    }

    function persistUrl() {
      const id = userKey();
      if (!id) return "";
      return "/api/sessions/" + encodeURIComponent(id) + "/close";
    }

    async function persistSession({ silent } = { silent: false }) {
      const url = persistUrl();
      if (!url || closing) return null;
      closing = true;
      try {
        const res = await fetch(url, { method: "POST", keepalive: true });
        const data = await res.json().catch(() => ({}));
        if (data.ingest && data.ingest.skipped) {
          if (!silent) $("debugHint").textContent = "会话已不在服务端（可能刚重启）";
          return data;
        }
        if (data.session) saveReleasedDraftFromSession(data.session);
        sessionId = "";
        $("chipSession").textContent = "已结束";
        if (!silent) {
          paintTrace({});
          $("debugHint").textContent = "会话结束入库";
          addMsg("sys", "本场已抽离入库，草稿已写入本机。");
        }
        return data;
      } catch (err) {
        if (!silent) alert("入库失败");
        return null;
      } finally {
        closing = false;
      }
    }

    function showRound(data) {
      const round = data.round || {
        session_id: data.session && data.session.session_id,
        group_id: data.session && data.session.group_id,
        reply: data.reply,
        memory_facts: data.facts,
        ingest: data.ingest,
        session: data.session,
      };
      $("debugHint").textContent = "刚回完这一句";
      paintRound(data, round);
      paintPrep(data.preprocess || round.preprocess, data.hitl || round.hitl, round.langgraph || data.langgraph, round.intent_tasks || data.intent_tasks);
      paintLlm((data.round && data.round.llm_calls) || data.llm_calls || []);
      paintRag((data.round && data.round.rag_enhance) || data.rag_enhance || []);
      paintTrace(data.observability || (round && round.observability) || (round.langgraph || data.langgraph));
      if (data.session) showSessionMeta(data.session);
      const hitl = data.hitl || round.hitl;
      if (hitl && hitl.resume_token) resumeToken = hitl.resume_token;
      else if (!hitl || !hitl.pending) resumeToken = "";
    }

    $("btnEnd").onclick = async () => {
      if (!sessionId) { alert("没有进行中的会话"); return; }
      await persistSession({ silent: false });
    };

    $("btnNew").onclick = () => startSession({ forceNew: true });

    $("linkSwitchUser").addEventListener("click", async (ev) => {
      ev.preventDefault();
      if (sessionId) await persistSession({ silent: true });
      location.href = "/";
    });

    async function send(preset, opts) {
      const speak = Boolean(opts && opts.speak);
      const channel = (opts && opts.channel) || "text";
      const presetText = typeof preset === "string" ? preset : "";
      const text = String(presetText || $("text").value || "").trim();
      if (!sessionId) { alert("请先新建会话"); return ""; }
      if (!text) return "";
      if (!presetText) $("text").value = "";
      addMsg("user", text);
      resetLiveDebug();
      $("btnSend").disabled = true;
      $("debugHint").textContent = "SSE 流式回复中";

      const res = await fetch("/api/sessions/" + encodeURIComponent(userKey()) + "/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "text/event-stream" },
        body: JSON.stringify({ text, resume_token: resumeToken || "", input_channel: channel, think: !!(document.getElementById("chkThink") && document.getElementById("chkThink").checked) }),
      });
      if (!res.ok) {
        $("btnSend").disabled = false;
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        addMsg("sys", "错误: " + (err.detail || "请求失败"));
        return "";
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let assistantEl = null;
      let spoken = "";

      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop() || "";
          for (const block of parts) {
            const line = block.trim();
            if (!line.startsWith("data: ")) continue;
            let data;
            try {
              data = JSON.parse(line.slice(6));
            } catch {
              continue;
            }
            if (data.event === "thinking") {
              $("debugHint").textContent = data.message || "正在回复…";
            } else if (data.event === "debug") {
              appendLiveDebug(data);
              if (data.kind === "trace" && (data.section || "").indexOf("tool_call") >= 0) {
                $("debugHint").textContent = (data.title || "trace") + " …";
              }
            } else if (data.event === "suspended") {
              resumeToken = data.resume_token || resumeToken;
              paintPrep(lastPrep, data, lastGraph, null);
              $("debugHint").textContent = "等待补充：" + (data.question || "");
              if (data.hitl_kind === "tool_approval") {
                if (!assistantEl) assistantEl = addMsg("ai", data.question || "");
                attachToolHitl(assistantEl, data);
              } else {
                attachActions(assistantEl, data.actions);
              }
            } else if (data.event === "token") {
              if (!assistantEl) {
                assistantEl = addMsg("ai", "");
              }
              const body = assistantEl.querySelector(".msg-text") || assistantEl;
              body.textContent += data.content || "";
              spoken = body.textContent;
              $("messages").scrollTop = $("messages").scrollHeight;
            } else if (data.event === "state") {
              showRound(data.data || {});
              attachActions(assistantEl, (data.data || {}).actions);
              $("debugHint").textContent = "SSE 结束";
            } else if (data.event === "error") {
              addMsg("sys", "错误: " + (data.message || "流式失败"));
            }
          }
        }
      } finally {
        $("btnSend").disabled = false;
      }
      if (speak && spoken && $("chkSpeak") && $("chkSpeak").checked) {
        await playTts(spoken);
      }
      return spoken;
    }

    let mediaRecorder = null;
    let audioChunks = [];

    async function playTts(text) {
      try {
        const res = await fetch("/api/voice/tts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text.slice(0, 800) }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          addMsg("sys", "播报失败: " + (err.detail || res.statusText));
          return;
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.onended = () => URL.revokeObjectURL(url);
        await audio.play();
      } catch {
        addMsg("sys", "播报失败");
      }
    }

    async function startTalk() {
      if (!sessionId) { alert("请先新建会话"); return; }
      if (!navigator.mediaDevices || !window.MediaRecorder) {
        addMsg("sys", "当前浏览器不支持录音");
        return;
      }
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (ev) => {
        if (ev.data && ev.data.size) audioChunks.push(ev.data);
      };
      mediaRecorder.start();
      $("btnMic").classList.add("mic-on");
      $("btnMic").textContent = "松开识别";
    }

    async function stopTalk() {
      const rec = mediaRecorder;
      mediaRecorder = null;
      $("btnMic").classList.remove("mic-on");
      $("btnMic").textContent = "按住说话";
      if (!rec || rec.state === "inactive") return;
      const blob = await new Promise((resolve) => {
        rec.onstop = () => resolve(new Blob(audioChunks, { type: rec.mimeType || "audio/webm" }));
        rec.stop();
        rec.stream.getTracks().forEach((track) => track.stop());
      });
      if (!blob.size) return;
      $("debugHint").textContent = "正在识别…";
      const body = new FormData();
      body.append("file", blob, "speech.webm");
      const res = await fetch("/api/voice/asr", { method: "POST", body });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        addMsg("sys", "识别失败: " + (data.detail || res.statusText));
        return;
      }
      const text = String(data.text || "").trim();
      if (!text) {
        addMsg("sys", "没有听清，请再说一次");
        return;
      }
      await send(text, { speak: true, channel: "asr" });
    }

    $("btnSend").onclick = () => send();
    $("text").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && !ev.shiftKey) {
        ev.preventDefault();
        send();
      }
    });
    $("btnMic").addEventListener("pointerdown", (ev) => {
      ev.preventDefault();
      startTalk().catch((err) => addMsg("sys", "无法开麦: " + (err && err.message ? err.message : "失败")));
    });
    $("btnMic").addEventListener("pointerup", () => {
      stopTalk().catch(() => addMsg("sys", "识别失败"));
    });
    $("btnMic").addEventListener("pointerleave", () => {
      if (mediaRecorder) stopTalk().catch(() => {});
    });

    $("btnReport").onclick = () => {
      if (!sessionId) { alert("请先新建会话"); return; }
      $("reportFile").click();
    };
    $("reportFile").addEventListener("change", async () => {
      const file = $("reportFile").files && $("reportFile").files[0];
      $("reportFile").value = "";
      if (!file) return;
      await uploadReport(file);
    });
    $("text").addEventListener("paste", async (ev) => {
      const items = ev.clipboardData && ev.clipboardData.items;
      if (!items) return;
      const imageItem = [...items].find((item) => item.type && item.type.startsWith("image/"));
      if (!imageItem) return;
      const file = imageItem.getAsFile();
      if (!file) return;
      ev.preventDefault();
      await uploadReport(file);
    });
    async function uploadReport(file) {
      if (!sessionId) { alert("请先新建会话"); return; }
      addMsg("user", "【上传检查报告】" + file.name);
      addMsg("sys", "正在解析检查报告（PDF 或图片）…");
      $("btnReport").disabled = true;
      $("btnSend").disabled = true;
      $("debugHint").textContent = "解析报告中";
      try {
        const body = new FormData();
        body.append("file", file, file.name || "report.png");
        body.append("think", document.getElementById("chkThink") && document.getElementById("chkThink").checked ? "true" : "false");
        const res = await fetch("/api/sessions/" + encodeURIComponent(userKey()) + "/report", {
          method: "POST",
          body,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          addMsg("sys", "解析失败: " + (data.detail || res.statusText));
          return;
        }
        addMsg("ai", [data.reply || "（无解读）", formatReportSummary(data.report)].filter(Boolean).join("\n\n"), data.actions);
        showRound(data);
        paintPrep(data.preprocess || {}, data.hitl);
        $("debugHint").textContent = "报告解读 " + ((data.report && data.report.parse_source) || "");
      } catch (err) {
        addMsg("sys", "上传失败");
      } finally {
        $("btnReport").disabled = false;
        $("btnSend").disabled = false;
      }
    }

    (async function bootFromQuery() {
      if (window.B2cPersist) {
        B2cPersist.mountUserBar(".b2c-user-bar");
        await B2cPersist.fetchServerDraft();
      }
      const params = new URLSearchParams(location.search);
      let uid = (params.get("user_id") || "").trim();
      if (!uid && window.B2cPersist) uid = B2cPersist.getUserId();
      if (!uid) return;
      $("userId").value = uid;
      if (window.B2cPersist) B2cPersist.setUserId(uid);
      await startSession({ forceNew: false });
    })();
  </script>
</body>
</html>
