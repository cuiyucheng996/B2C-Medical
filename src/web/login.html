<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B2C 登录</title>
  <style>
    :root {
      --bg: #eef3ef;
      --ink: #1c241e;
      --muted: #5c6b62;
      --card: #ffffff;
      --line: #d5e0d8;
      --accent: #2f6f4e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: radial-gradient(1200px 500px at 10% -10%, #dceadf, var(--bg));
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .shell { max-width: 880px; margin: 0 auto; padding: 32px 20px 48px; }
    h1 { margin: 0; font-size: 26px; }
    .sub { margin: 8px 0 22px; color: var(--muted); font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 6px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fbfdfb;
      font-size: 14px;
    }
    button {
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .err { color: #9b2c2c; font-size: 13px; min-height: 18px; }
    .user {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;
      background: #fbfdfb;
    }
    .user button { margin: 0; background: #e8eee9; color: var(--ink); }
    .name { font-size: 14px; }
    .id { font-size: 12px; color: var(--muted); word-break: break-all; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="shell">
    <h1>B2C 测试登录</h1>
    <p class="sub">账号写在 Neo4j 的 UserInfo 上。登录名可自定；内部 user_id 用于陪聊和长期记忆。<a href="/tools" style="color:#2f6f4e;">工具注册表</a> · <a href="/eval" style="color:#2f6f4e;">评测台</a></p>
    <div class="grid">
      <section class="card">
        <h2 style="margin:0 0 8px;font-size:16px;">登录</h2>
        <label>登录名或 user_id</label>
        <input id="loginName" autocomplete="username" />
        <label>PIN（没设过可空）</label>
        <input id="loginPin" type="password" autocomplete="current-password" />
        <div class="err" id="loginErr"></div>
        <button id="btnLogin">进入陪聊</button>
        <p class="hint">仅测试用，PIN 只做简单校验，不是正式鉴权。</p>
      </section>
      <section class="card">
        <h2 style="margin:0 0 8px;font-size:16px;">创建用户</h2>
        <label>登录名</label>
        <input id="regName" placeholder="例如 xiaoming" />
        <label>显示名</label>
        <input id="regDisplay" placeholder="可选" />
        <label>PIN（可选）</label>
        <input id="regPin" type="password" />
        <div class="err" id="regErr"></div>
        <button id="btnReg">创建并进入</button>
      </section>
    </div>
    <section class="card" style="margin-top:16px;">
      <h2 style="margin:0 0 10px;font-size:16px;">已有 UserInfo</h2>
      <div id="userList" class="hint">读取中…</div>
    </section>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);

    const USER_KEY = "b2c-user-id";

    function goChat(userId) {
      const uid = String(userId || "").trim();
      if (!uid) return;
      try { localStorage.setItem(USER_KEY, uid); } catch (e) {}
      location.href = "/chat?user_id=" + encodeURIComponent(uid);
    }

    async function loadUsers() {
      const box = $("userList");
      try {
        const res = await fetch("/api/users");
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "读取失败");
        const users = data.users || [];
        if (!users.length) {
          box.textContent = "库里还没有 UserInfo。先在右侧创建一个。";
          return;
        }
        box.innerHTML = "";
        users.forEach((u) => {
          const row = document.createElement("div");
          row.className = "user";
          const left = document.createElement("div");
          left.innerHTML = `<div class="name">${u.display_name || u.login_name || u.user_id}</div>
            <div class="id">${u.login_name ? "登录名 " + u.login_name + " · " : ""}id ${u.user_id}${u.has_pin ? " · 有PIN" : ""}</div>`;
          const btn = document.createElement("button");
          btn.textContent = "选用";
          btn.onclick = () => {
            $("loginName").value = u.login_name || u.user_id;
            goChat(u.user_id || u.login_name);
          };
          row.appendChild(left);
          row.appendChild(btn);
          box.appendChild(row);
        });
      } catch (err) {
        box.textContent = String(err.message || err);
      }
    }

    $("btnLogin").onclick = async () => {
      $("loginErr").textContent = "";
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ login_name: $("loginName").value, pin: $("loginPin").value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        $("loginErr").textContent = data.detail === "not_found" ? "用户不存在"
          : data.detail === "bad_pin" ? "PIN 不正确"
          : (data.detail || "登录失败");
        return;
      }
      const user = data.user || {};
      const uid = String(user.user_id || user.login_name || "").trim();
      if (!uid) {
        $("loginErr").textContent = "登录成功但没有 UserInfo.id";
        return;
      }
      goChat(uid);
    };

    $("btnReg").onclick = async () => {
      $("regErr").textContent = "";
      const res = await fetch("/api/users", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          login_name: $("regName").value,
          display_name: $("regDisplay").value,
          pin: $("regPin").value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        $("regErr").textContent = data.detail === "login_name_taken" ? "登录名已存在" : (data.detail || "创建失败");
        return;
      }
      const created = data.user || {};
      goChat(created.user_id || created.login_name);
    };

    loadUsers();
  </script>
</body>
</html>
